services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./backend/db:/app/db
      - ./backend/app:/app/app
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Keep these overrides for local testing while the stack uses HTTP.
      # TODO: Remove both once HTTPS is configured to restore production defaults.
      RAILS_ASSUME_SSL: "false"
      RAILS_FORCE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
  
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:3000
      VITE_API_URL: /api

#  nginx:
#    build: ./nginx
#    ports:
#      - "443:443"
#    depends_on:
#      - backend

volumes:
  pgdata:
